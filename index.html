<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Financeiro</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --rosa:     #f06292;
    --rosa-esc: #e91e8c;
    --rosa-clr: #fce4ec;
    --amarelo:  #fdd835;
    --amar-esc: #f9a825;
    --branco:   #ffffff;
    --cinza:    #f8f0f4;
    --texto:    #3d1a2e;
    --texto-sub:#9e6b80;
    --sombra:   0 8px 32px rgba(240,98,146,.18);
    --radius:   18px;
    --trans:    all .35s cubic-bezier(.4,0,.2,1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: linear-gradient(135deg, #fff0f7 0%, #fffde7 50%, #fce4ec 100%);
    min-height: 100vh;
    color: var(--texto);
  }

  /* ── DECORAÇÃO DE FUNDO ── */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(253,216,53,.25), transparent 70%);
    top: -120px; right: -120px;
  }
  body::after {
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(240,98,146,.18), transparent 70%);
    bottom: -100px; left: -100px;
  }

  /* ── LOGIN ── */
  .login {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    animation: fadeIn .6s ease;
  }

  .login-box {
    background: var(--branco);
    padding: 48px 40px;
    border-radius: 28px;
    text-align: center;
    box-shadow: var(--sombra);
    max-width: 340px;
    width: 90%;
    border: 1.5px solid rgba(240,98,146,.15);
  }

  .login-icon {
    font-size: 52px;
    display: block;
    margin-bottom: 12px;
    animation: pulse 2.4s ease-in-out infinite;
  }

  .login-box h2 {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    color: var(--rosa-esc);
    margin-bottom: 8px;
  }

  .login-box p {
    color: var(--texto-sub);
    font-size: 14px;
    margin-bottom: 28px;
  }

  .btn-google {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--amarelo), var(--amar-esc));
    color: var(--texto);
    border: none;
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(249,168,37,.4);
    transition: var(--trans);
  }
  .btn-google:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(249,168,37,.5);
  }
  .btn-google:active { transform: translateY(0); }

  /* ── APP ── */
  .app {
    display: none;
    position: relative;
    z-index: 1;
    max-width: 520px;
    margin: 30px auto 60px;
    padding: 0 16px;
    animation: slideUp .5s ease;
  }

  /* ── HEADER ── */
  .header {
    background: linear-gradient(135deg, var(--rosa-esc), var(--rosa));
    border-radius: 24px;
    padding: 24px 24px 20px;
    margin-bottom: 20px;
    box-shadow: 0 8px 28px rgba(233,30,140,.22);
    color: white;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '💸';
    font-size: 90px;
    position: absolute;
    right: -10px;
    top: -10px;
    opacity: .12;
    line-height: 1;
  }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.2;
  }

  .header small {
    font-size: 12px;
    opacity: .75;
    display: block;
    margin-top: 4px;
  }

  .btn-fechar {
    background: rgba(255,255,255,.22);
    border: 1.5px solid rgba(255,255,255,.35);
    color: white;
    padding: 8px 14px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--trans);
    white-space: nowrap;
  }
  .btn-fechar:hover {
    background: rgba(255,255,255,.35);
    transform: scale(1.04);
  }

  /* ── MENU MESES ── */
  .menu-meses {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 2px 8px;
    scrollbar-width: none;
  }
  .menu-meses::-webkit-scrollbar { display: none; }

  .menu-meses button {
    padding: 7px 14px;
    border: 1.5px solid rgba(240,98,146,.2);
    border-radius: 50px;
    background: var(--branco);
    color: var(--texto-sub);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: var(--trans);
    flex-shrink: 0;
  }
  .menu-meses button:hover {
    border-color: var(--rosa);
    color: var(--rosa-esc);
    transform: translateY(-1px);
  }
  .menu-meses button.ativo {
    background: linear-gradient(135deg, var(--amarelo), var(--amar-esc));
    border-color: var(--amar-esc);
    color: var(--texto);
    font-weight: 700;
    box-shadow: 0 4px 12px rgba(253,216,53,.45);
    transform: translateY(-1px);
  }

  /* ── CARD ── */
  .card {
    background: var(--branco);
    border-radius: 22px;
    padding: 24px;
    margin-bottom: 16px;
    box-shadow: 0 4px 20px rgba(240,98,146,.1);
    border: 1.5px solid rgba(240,98,146,.1);
  }

  .card-title {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--texto-sub);
    margin-bottom: 14px;
  }

  /* ── INPUTS ── */
  .input-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .input-wrap {
    position: relative;
  }
  .input-wrap span {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    pointer-events: none;
  }

  input[type="text"],
  input[type="number"] {
    width: 100%;
    padding: 13px 14px 13px 40px;
    border: 1.5px solid rgba(240,98,146,.2);
    border-radius: 14px;
    background: var(--cinza);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--texto);
    transition: var(--trans);
    outline: none;
  }
  input:focus {
    border-color: var(--rosa);
    background: white;
    box-shadow: 0 0 0 3px rgba(240,98,146,.12);
  }
  input::placeholder { color: var(--texto-sub); }

  .btn-add {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--rosa), var(--rosa-esc));
    border: none;
    border-radius: 14px;
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(233,30,140,.3);
    transition: var(--trans);
    margin-top: 4px;
    letter-spacing: .3px;
  }
  .btn-add:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 26px rgba(233,30,140,.4);
  }
  .btn-add:active { transform: translateY(0); }

  /* ── LISTA ── */
  .lista-wrap ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .lista-wrap li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: var(--cinza);
    border-radius: 14px;
    border: 1.5px solid rgba(240,98,146,.08);
    animation: slideIn .3s ease;
    transition: var(--trans);
  }
  .lista-wrap li:hover {
    border-color: rgba(240,98,146,.25);
    box-shadow: 0 3px 12px rgba(240,98,146,.1);
  }

  .item-info { flex: 1; }
  .item-desc {
    font-weight: 600;
    font-size: 14px;
    color: var(--texto);
  }
  .item-val {
    font-size: 13px;
    color: var(--rosa-esc);
    font-weight: 700;
    margin-top: 2px;
  }

  .btn-remover {
    background: linear-gradient(135deg, #f06292, #c2185b);
    color: white;
    border: none;
    padding: 7px 13px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--trans);
    flex-shrink: 0;
    margin-left: 12px;
  }
  .btn-remover:hover {
    transform: scale(1.07);
    box-shadow: 0 4px 12px rgba(194,24,91,.35);
  }

  .lista-vazia {
    text-align: center;
    color: var(--texto-sub);
    font-size: 14px;
    padding: 28px 0 10px;
  }

  /* ── TOTAL ── */
  .total-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(135deg, var(--amarelo), var(--amar-esc));
    border-radius: 16px;
    padding: 18px 20px;
    margin-top: 6px;
    box-shadow: 0 4px 18px rgba(249,168,37,.3);
  }
  .total-label {
    font-size: 13px;
    font-weight: 600;
    color: rgba(61,26,46,.6);
    text-transform: uppercase;
    letter-spacing: .6px;
  }
  .total-val {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--texto);
  }

  /* ── FECHADO BADGE ── */
  .badge-fechado {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,.25);
    border: 1.5px solid rgba(255,255,255,.4);
    color: white;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 50px;
    margin-top: 12px;
  }

  /* ── ANIMAÇÕES ── */
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-12px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%       { transform: scale(1.12); }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="login">
  <div class="login-box">
    <span class="login-icon">💎</span>
    <h2>Controle Financeiro</h2>
    <p>Organize suas finanças com estilo</p>
    <button class="btn-google" onclick="login()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20H24v8h11.3C33.7 33.4 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.7-8 19.7-20 0-1.3-.1-2.7-.1-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.5 18.9 12 24 12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 16.1 4 9.3 8.4 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5l-6.3-5.2C29.3 35.3 26.8 36 24 36c-5.2 0-9.7-3.5-11.3-8.3l-6.6 5.1C9.5 39.7 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.5l6.3 5.2C41.3 35.3 44 30 44 24c0-1.3-.1-2.7-.4-4z"/></svg>
      Entrar com Google
    </button>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-row">
      <div>
        <h1 id="mesAtual">Janeiro</h1>
        <small id="user"></small>
      </div>
      <button class="btn-fechar" onclick="fecharMes()">🔒 Fechar mês</button>
    </div>
    <div id="badgeFechado"></div>
  </div>

  <!-- MENU MESES -->
  <div class="menu-meses" id="menuMeses"></div>

  <!-- FORMULÁRIO -->
  <div class="card">
    <div class="card-title">✦ Nova despesa</div>
    <div class="input-group">
      <div class="input-wrap">
        <span>📝</span>
        <input type="text" id="desc" placeholder="Descrição da despesa">
      </div>
      <div class="input-wrap">
        <span>💰</span>
        <input type="number" id="val" placeholder="Valor em R$" min="0" step="0.01">
      </div>
      <button class="btn-add" onclick="adicionar()">+ Adicionar despesa</button>
    </div>
  </div>

  <!-- LISTA -->
  <div class="card lista-wrap">
    <div class="card-title">✦ Despesas do mês</div>
    <ul id="lista"></ul>
    <div class="total-box" style="margin-top:16px">
      <span class="total-label">Total</span>
      <span class="total-val" id="total">R$ 0,00</span>
    </div>
  </div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDzPAdEz9KZcosVz76EAjoqLPZ_CLlLDbs",
  authDomain: "controle-de-despesas-d337d.firebaseapp.com",
  projectId: "controle-de-despesas-d337d"
};

firebase.initializeApp(firebaseConfig);

const db   = firebase.firestore();
const auth = firebase.auth();

let usuario  = null;
let mesAtual = "01";
let fechado  = false;

const meses = [
  "Janeiro","Fevereiro","Março","Abril","Maio","Junho",
  "Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"
];

/* ── AUTH ── */
auth.onAuthStateChanged(user => {
  if (user) {
    usuario = user;
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display   = "block";
    document.getElementById("user").innerText = user.email;
    criarMenu();
    selecionarMes("01");
  }
});

function login() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider);
}

/* ── MENU ── */
function criarMenu() {
  const menu = document.getElementById("menuMeses");
  menu.innerHTML = "";
  meses.forEach((nome, i) => {
    const btn = document.createElement("button");
    const num = (i + 1).toString().padStart(2, "0");
    btn.innerText = nome;
    btn.onclick   = () => selecionarMes(num);
    menu.appendChild(btn);
  });
}

function selecionarMes(num) {
  mesAtual = num;
  document.querySelectorAll(".menu-meses button").forEach((b, i) => {
    b.classList.toggle("ativo", (i + 1) == parseInt(num));
  });
  document.getElementById("mesAtual").innerText = meses[parseInt(num) - 1];
  verificarFechamento();
}

/* ── FECHAMENTO ── */
function verificarFechamento() {
  db.collection("meses")
    .doc(usuario.uid + "_" + mesAtual)
    .get()
    .then(doc => {
      fechado = doc.exists;
      atualizarBadge();
      carregar();
    });
}

function atualizarBadge() {
  const badge = document.getElementById("badgeFechado");
  badge.innerHTML = fechado
    ? '<span class="badge-fechado">🔒 Mês fechado</span>'
    : '';
}

function fecharMes() {
  if (fechado) return alert("Este mês já está fechado.");
  if (!confirm("Fechar o mês? Não será possível adicionar ou remover despesas.")) return;
  db.collection("meses")
    .doc(usuario.uid + "_" + mesAtual)
    .set({ fechado: true });
  fechado = true;
  atualizarBadge();
  carregar();
}

/* ── CARREGAR ── */
function carregar() {
  db.collection("despesas")
    .where("user", "==", usuario.uid)
    .where("mes", "==", mesAtual)
    .get()
    .then(snapshot => {
      const lista = document.getElementById("lista");
      let html  = "";
      let total = 0;

      snapshot.forEach(doc => {
        const d = doc.data();
        total += d.valor;
        html += `
          <li>
            <div class="item-info">
              <div class="item-desc">${d.descricao}</div>
              <div class="item-val">R$ ${d.valor.toFixed(2)}</div>
            </div>
            ${fechado ? "" : `<button class="btn-remover" onclick="remover('${doc.id}')">✕ Remover</button>`}
          </li>`;
      });

      lista.innerHTML = html || '<li style="background:transparent;border:none"><div class="lista-vazia">🌸 Nenhuma despesa ainda</div></li>';
      document.getElementById("total").innerText = "R$ " + total.toFixed(2);
    });
}

/* ── ADICIONAR ── */
function adicionar() {
  if (fechado) return alert("Mês fechado! Não é possível adicionar despesas.");
  const desc = document.getElementById("desc").value.trim();
  const val  = parseFloat(document.getElementById("val").value);
  if (!desc || isNaN(val) || val <= 0) return alert("Preencha a descrição e um valor válido.");

  db.collection("despesas").add({
    descricao: desc,
    valor:     val,
    user:      usuario.uid,
    mes:       mesAtual
  }).then(() => {
    document.getElementById("desc").value = "";
    document.getElementById("val").value  = "";
    carregar();
  });
}

/* ── REMOVER ── */
function remover(id) {
  if (!confirm("Remover esta despesa?")) return;
  db.collection("despesas").doc(id).delete().then(() => carregar());
}
</script>
</body>
</html>
