<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Controle de Despesas</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  display:flex;
  background:#fce4ec;
}

/* MENU */
.menu{
  width:200px;
  background:#c2185b;
  color:white;
  padding:20px;
}

.menu h3{
  margin-top:0;
}

.menu button{
  display:block;
  width:100%;
  margin-top:10px;
  padding:8px;
  border:none;
  background:#880e4f;
  color:white;
  cursor:pointer;
  border-radius:5px;
}

/* CONTEÚDO */
.main{
  flex:1;
  padding:20px;
}

.box{
  background:white;
  padding:20px;
  border-radius:10px;
}

/* BOTÕES */
.add{
  background:gold;
}

.remover{
  background:red;
  color:white;
  border:none;
  margin-left:10px;
}

.logout{
  background:#c2185b;
  color:white;
}

input,button{
  width:100%;
  margin-top:10px;
  padding:8px;
}
</style>
</head>

<body>

<!-- MENU MESES -->
<div class="menu" id="menu">
  <h3>📅 Meses</h3>
  <button onclick="trocarMes('2024-01')">Janeiro</button>
  <button onclick="trocarMes('2024-02')">Fevereiro</button>
  <button onclick="trocarMes('2024-03')">Março</button>
  <button onclick="logout()">🚪 Sair</button>
</div>

<!-- CONTEÚDO -->
<div class="main">

<div class="box">

<h2>💸 Despesas</h2>
<p id="user"></p>

<input id="desc" placeholder="Descrição">
<input id="val" type="number" placeholder="Valor">

<button class="add" onclick="adicionar()">➕ Adicionar</button>

<ul id="lista"></ul>
<h3 id="total"></h3>

</div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDzPAdEz9KZcosVz76EAjoqLPZ_CLlLDbs",
  authDomain: "controle-de-despesas-d337d.firebaseapp.com",
  projectId: "controle-de-despesas-d337d"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();

let usuario = null;
let mesAtual = new Date().toISOString().slice(0,7);

/* LOGIN */
auth.onAuthStateChanged(user=>{
  if(user){
    usuario=user;
    document.getElementById("user").innerText=user.email;
    carregar();
  }else{
    login();
  }
});

/* LOGIN */
function login(){
  const provider=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider);
}

/* TROCAR MÊS */
function trocarMes(mes){
  mesAtual = mes;
  carregar();
}

/* CARREGAR */
function carregar(){
  db.collection("despesas")
  .where("user","==",usuario.uid)
  .where("mes","==",mesAtual)
  .get()
  .then(snapshot=>{

    let lista=document.getElementById("lista");
    lista.innerHTML="";
    let total=0;

    snapshot.forEach(doc=>{
      let d=doc.data();
      total+=d.valor;

      lista.innerHTML+=`
      <li>
        ${d.descricao} - R$ ${d.valor}
        <button class="remover" onclick="remover('${doc.id}')">❌ Remover</button>
      </li>`;
    });

    document.getElementById("total").innerText="Total: R$ "+total.toFixed(2);
  });
}

/* ADICIONAR */
function adicionar(){

  let desc=document.getElementById("desc").value;
  let val=parseFloat(document.getElementById("val").value);

  if(!desc||isNaN(val)) return alert('Preencha');

  db.collection("despesas").add({
    descricao:desc,
    valor:val,
    user:usuario.uid,
    mes:mesAtual
  }).then(()=>carregar());
}

/* REMOVER */
function remover(id){
  db.collection("despesas").doc(id).delete()
  .then(()=>carregar());
}

/* LOGOUT */
function logout(){
  auth.signOut();
}
</script>

</body>
</html>
