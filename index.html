        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-analytics.js";
        // TODO: Add SDKs for Firebase products that you want to use
        // https://firebase.google.com/docs/web/setup#available-libraries

        // Your web app's Firebase configuration
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
            apiKey: "AIzaSyDzPAdEz9KZcosVz76EAjoqLPZ_CLlLDbs",
            authDomain: "controle-de-despesas-d337d.firebaseapp.com",
            projectId: "controle-de-despesas-d337d",
            storageBucket: "controle-de-despesas-d337d.firebasestorage.app",
            messagingSenderId: "193503396678",
            appId: "1:193503396678:web:1d6da798b3c07284dcdb47",
            measurementId: "G-KHV3XKFDMR"

        const app = initializeApp(firebaseConfig);

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: linear-gradient(135deg, #fff0f5, #fce4ec);
        }

        .container {
            max-width: 500px;
            margin: 30px auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
        }

        button,
        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
        }

        button {
            background: #c2185b;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>💸 Controle com Login</h2>

        <button onclick="login()">🔐 Entrar com Google</button>
        <button onclick="logout()">🚪 Sair</button>

        <p id="user"></p>

        <input type="text" id="desc" placeholder="Descrição">
        <input type="number" id="val" placeholder="Valor">
        <button onclick="adicionar()">➕ Adicionar</button>

        <ul id="lista"></ul>
        <h3 id="total"></h3>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "COLE_AQUI",
            authDomain: "controle-de-despesas-d337d.firebaseapp.com",
            projectId: "controle-de-despesas-d337d",
            storageBucket: "controle-de-despesas-d337d.appspot.com",
            messagingSenderId: "COLE_AQUI",
            appId: "COLE_AQUI"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let usuario = null;

        auth.onAuthStateChanged(u => {
            usuario = u;
            if (u) {
                document.getElementById('user').innerText = "Usuário: " + u.email;
                carregar();
            }
        });

        function login() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider);
        }

        function logout() { auth.signOut(); }

        function carregar() {
            db.collection("despesas").where("user", "==", usuario.uid)
                .onSnapshot(snapshot => {
                    const lista = document.getElementById('lista');
                    lista.innerHTML = '';
                    let total = 0;

                    snapshot.forEach(doc => {
                        const d = doc.data();
                        total += d.valor;
                        lista.innerHTML += `
      <li>${d.descricao} - R$ ${d.valor}
      <button onclick="remover('${doc.id}')">❌</button></li>`;
                    });

                    document.getElementById('total').innerText = "Total: R$ " + total.toFixed(2);
                });
        }

        function adicionar() {
            if (!usuario) return alert('Faça login');

            const desc = document.getElementById('desc').value;
            const val = parseFloat(document.getElementById('val').value);

            if (!desc || isNaN(val)) return alert('Preencha');

            db.collection("despesas").add({
                descricao: desc,
                valor: val,
                user: usuario.uid
            });

            document.getElementById('desc').value = '';
            document.getElementById('val').value = '';
        }

        function remover(id) { db.collection("despesas").doc(id).delete(); }
    </script>

</body>

</html>
