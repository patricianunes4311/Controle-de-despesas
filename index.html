<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Despesas</title>

<style>
body {
  font-family: Arial;
  margin:0;
  display:flex;
  height:100vh;
  background: linear-gradient(135deg,#fff0f5,#fce4ec);
  overflow:hidden;
  transition:0.3s;
}

/* MENU */
.menu {
  width:220px;
  background:linear-gradient(180deg,#c2185b,#880e4f);
  color:#fff;
  padding:15px;
  transition:0.3s;
  height:100vh;
  overflow-y:auto;
}

.menu.closed { width:70px; }

.menu button {
  width:100%;
  margin-bottom:10px;
  background:#fff2;
  color:white;
  border:none;
  padding:10px;
  cursor:pointer;
  border-radius:10px;
}

.menu ul { list-style:none; padding:0; }

.menu li {
  margin:10px 0;
  cursor:pointer;
  padding:8px;
  border-radius:8px;
  transition:0.3s;
  display:flex;
  align-items:center;
  gap:8px;
}

.menu li:hover {
  background:#ffffff33;
  transform:translateX(4px);
}

/* CONTAINER */
.container {
  flex:1;
  margin:20px;
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
  overflow:auto;
  animation:fade 0.5s;
}

@keyframes fade {
  from {opacity:0; transform:translateY(10px);} 
  to {opacity:1;}
}

h1 {
  text-align:center;
  color:#c2185b;
}

input, button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:14px;
}

button {
  background:linear-gradient(45deg,#d4af37,#ffd700);
  color:white;
  border:none;
  font-weight:bold;
  transition:0.3s;
}

button:hover { transform:scale(1.03); }

.fechar { background:#c2185b; }

/* TABELA */
table {
  width:100%;
  margin-top:20px;
  border-collapse: collapse;
}

th, td {
  padding:10px;
  border-bottom:1px solid #eee;
}

tr:hover {
  background:#fff5f8;
  transition:0.3s;
}

.remover-btn {
  background:#c2185b;
  color:white;
  border:none;
  padding:6px 12px;
  border-radius:8px;
  cursor:pointer;
  transition:0.2s;
}

.remover-btn:hover {
  background:#880e4f;
  transform:scale(1.05);
}

.total {
  margin-top:15px;
  font-weight:bold;
  font-size:18px;
}

/* MOBILE */
@media (max-width:600px){
  body {
    flex-direction:column;
    height:auto;
    overflow:auto;
  }

  .menu {
    width:100%;
    height:auto;
    position:sticky;
    top:0;
    z-index:10;
  }

  .menu ul {
    display:flex;
    overflow-x:auto;
    gap:8px;
    padding-top:10px;
  }

  .menu li {
    flex:none;
    background:#ffffff22;
  }

  .container {
    margin:10px;
  }
}
</style>
</head>

<body>

<div class="menu" id="menu">
  <button onclick="toggleMenu()">☰ Menu</button>
  <ul>
    <li onclick="trocarMes('2026-12')">📅 Dezembro</li>
    <li onclick="trocarMes('2026-11')">📅 Novembro</li>
    <li onclick="trocarMes('2026-10')">📅 Outubro</li>
    <li onclick="trocarMes('2026-09')">📅 Setembro</li>
    <li onclick="trocarMes('2026-08')">📅 Agosto</li>
    <li onclick="trocarMes('2026-07')">📅 Julho</li>
    <li onclick="trocarMes('2026-06')">📅 Junho</li>
    <li onclick="trocarMes('2026-05')">📅 Maio</li>
    <li onclick="trocarMes('2026-04')">📅 Abril</li>
    <li onclick="trocarMes('2026-03')">📅 Março</li>
    <li onclick="trocarMes('2026-02')">📅 Fevereiro</li>
    <li onclick="trocarMes('2026-01')">📅 Janeiro</li>

  </ul>
</div>

<div class="container">
  <h1>💸 Controle de Despesas</h1>
  <h3 id="mesAtual"></h3>

  <input type="text" id="descricao" placeholder="📝 Descrição">
  <input type="number" id="valor" placeholder="💰 Valor">
  
  <button onclick="adicionar()">➕ Adicionar</button>
  <button class="fechar" onclick="fecharMes()">🔒 Fechar mês</button>

  <table>
    <thead>
      <tr>
        <th>Descrição</th>
        <th>Valor</th>
        <th>Ação</th>
      </tr>
    </thead>
    <tbody id="lista"></tbody>
  </table>

  <div class="total" id="total">Total: R$ 0,00</div>
</div>

<script>
let mesAtual = '2026-05';

function toggleMenu(){
  document.getElementById('menu').classList.toggle('closed');
}

function carregarDados(){
  return JSON.parse(localStorage.getItem(mesAtual)) || [];
}

function salvarDados(dados){
  localStorage.setItem(mesAtual, JSON.stringify(dados));
}

function formatar(v){ return v.toFixed(2).replace('.',','); }

function render(){
  const lista = document.getElementById('lista');
  lista.innerHTML = '';
  let total=0;

  document.getElementById('mesAtual').innerText = '📆 Mês atual: ' + mesAtual;

  const despesas = carregarDados();

  despesas.forEach((d,i)=>{
    total+=d.valor;
    lista.innerHTML+=`<tr>
      <td>${d.descricao}</td>
      <td>R$ ${formatar(d.valor)}</td>
      <td><button class="remover-btn" onclick="remover(${i})">❌ Remover</button></td>
    </tr>`;
  });

  document.getElementById('total').innerText=`💰 Total: R$ ${formatar(total)}`;
}

function adicionar(){
  if(localStorage.getItem(mesAtual + '_fechado')){
    alert('Esse mês está fechado!');
    return;
  }

  let despesas = carregarDados();
  const desc=document.getElementById('descricao').value;
  const val=parseFloat(document.getElementById('valor').value);

  if(!desc || isNaN(val)){
    alert('Preencha corretamente');
    return;
  }

  despesas.push({descricao:desc,valor:val});
  salvarDados(despesas);
  render();

  document.getElementById('descricao').value='';
  document.getElementById('valor').value='';
}

function remover(i){
  if(localStorage.getItem(mesAtual + '_fechado')){
    alert('Esse mês está fechado!');
    return;
  }

  let despesas = carregarDados();
  despesas.splice(i,1);
  salvarDados(despesas);
  render();
}

function fecharMes(){
  localStorage.setItem(mesAtual + '_fechado', true);
  alert('Mês fechado!');
}

function trocarMes(mes){ mesAtual = mes; render(); }

render();
</script>

</body>
</html>
