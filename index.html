<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Despesas</title>

<!-- ✅ Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
body{
  font-family: Arial;
  margin:0;
  background:linear-gradient(135deg,#fff0f5,#fce4ec);
}

/* LOGIN */
.login{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box{
  background:#fff;
  padding:30px;
  border-radius:15px;
  width:300px;
  text-align:center;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

.box h2{
  color:#c2185b;
}

.login-btn{
  background:linear-gradient(45deg,#d4af37,#ffd700);
  border:none;
  padding:12px;
  border-radius:10px;
  width:100%;
  cursor:pointer;
  font-weight:bold;
}

/* APP */
.app{
  display:none;
  max-width:500px;
  margin:30px auto;
  background:#fff;
  padding:20px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

h1{
  color:#c2185b;
}

input,button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #ddd;
}

.add{
  background:linear-gradient(45deg,#d4af37,#ffd700);
}

.logout{
  background:#c2185b;
  color:white;
  border:none;
}

.remover{
  background:#c2185b;
  color:white;
  border:none;
  margin-left:10px;
}

.total{
  margin-top:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="login">
  <div class="box">
    <h2>💎 Controle Financeiro</h2>
    <p>Faça login para continuar</p>
    <button class="login-btn" onclick="login()">🔐 Entrar com Google</button>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <h1>💸 Minhas Despesas</h1>
  <p id="user"></p>

  <input id="desc" placeholder="Descrição">
  <input id="val" type="number" placeholder="Valor">

  <button class="add" onclick="adicionar()">➕ Adicionar</button>
  <button class="logout" onclick="logout()">🚪 Sair</button>

  <ul id="lista"></ul>
  <div id="total" class="total"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDzPAdEz9KZcosVz76EAjoqLPZ_CLlLDbs",
  authDomain: "controle-de-despesas-d337d.firebaseapp.com",
  projectId: "controle-de-despesas-d337d",
  storageBucket: "controle-de-despesas-d337d.appspot.com",
  messagingSenderId: "193503396678",
  appId: "1:193503396678:web:1d6da798b3c07284dcdb47"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let usuario = null;

/* ✅ LOGIN / ESTADO */
auth.onAuthStateChanged(user => {

  usuario = user;

  if(user){
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("user").innerText = "👤 " + user.email;

    carregarDados(); // ✅ carrega uma vez
  } else {
    document.getElementById("login").style.display = "flex";
    document.getElementById("app").style.display = "none";
  }
});

/* ✅ LOGIN ESTÁVEL */
function login(){
  const provider = new firebase.auth.GoogleAuthProvider();

  auth.signInWithPopup(provider)
    .then(result => {
      console.log("Login OK:", result.user.email);
    })
    .catch(error => {
      console.error(error);
      alert("Erro no login");
    });
}

/* LOGOUT */
function logout(){
  auth.signOut();
}

/* ✅ CARREGAR (SEM LOOP) */
function carregarDados(){
  db.collection("despesas")
    .where("user", "==", usuario.uid)
    .get()
    .then(snapshot => {

      let lista = document.getElementById("lista");
      lista.innerHTML = "";
      let total = 0;

      snapshot.forEach(doc => {
        let d = doc.data();
        total += d.valor;

        lista.innerHTML += `
        <li>
          ${d.descricao} - R$ ${d.valor}
          <button class="remover" onclick="remover('${doc.id}')">❌</button>
        </li>`;
      });

      document.getElementById("total").innerText =
        "💰 Total: R$ " + total.toFixed(2);
    });
}

/* ADICIONAR */
function adicionar(){
  if(!usuario) return alert("Faça login");

  let desc = document.getElementById("desc").value;
  let val = parseFloat(document.getElementById("val").value);

  if(!desc || isNaN(val)) return alert("Preencha");

  db.collection("despesas").add({
    descricao: desc,
    valor: val,
    user: usuario.uid
  })
  .then(() => carregarDados()); // ✅ recarrega sem loop
}

/* REMOVER */
function remover(id){
  db.collection("despesas").doc(id).delete()
    .then(() => carregarDados()); // ✅ recarrega
}
</script>

</body>
</html>
