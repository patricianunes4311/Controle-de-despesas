<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Despesas</title>

<style>
body {
  font-family: Arial;
  margin:0;
  display:flex;
  height:100vh;
  background: linear-gradient(135deg,#fff0f5,#fce4ec);
  overflow:hidden;
}

/* MENU */
.menu {
  width:220px;
  background:#c2185b;
  color:#fff;
  padding:15px;
  transition:0.3s;
  height:100vh;
  overflow-y:auto;
}

.menu.closed {
  width:70px;
}

.menu button {
  width:100%;
  margin-bottom:10px;
  background:#880e4f;
  color:white;
  border:none;
  padding:8px;
  cursor:pointer;
}

.menu ul {
  list-style:none;
  padding:0;
}

.menu li {
  margin:10px 0;
  cursor:pointer;
  padding:5px;
  border-radius:5px;
}

.menu li:hover {
  background:#880e4f;
}

/* CONTAINER */
.container {
  flex:1;
  margin:20px;
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
  overflow:auto;
}

h1 {
  text-align:center;
  color:#c2185b;
}

input, button {
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #ddd;
}

button {
  background:linear-gradient(45deg,#d4af37,#ffd700);
  color:white;
  border:none;
}

.fechar {
  background:#c2185b;
}

/* TABELA */
table {
  width:100%;
  margin-top:20px;
  border-collapse: collapse;
}

th, td {
  padding:10px;
  border-bottom:1px solid #eee;
}

tr:hover {
  background:#fff5f8;
}

.remover-btn {
  background:#c2185b;
  color:white;
  border:none;
  padding:5px 10px;
  border-radius:5px;
  cursor:pointer;
}

.total {
  margin-top:15px;
  font-weight:bold;
}

/* RESPONSIVO */
@media (max-width:600px){
  body {
    flex-direction:column;
    overflow:auto;
  }

  .menu {
    width:100%;
    height:auto;
    display:flex;
    overflow-x:auto;
  }

  .menu ul {
    display:flex;
    gap:10px;
  }

  .menu li {
    background:#c2185b;
    padding:8px 12px;
    white-space:nowrap;
  }

  .container {
    margin:10px;
  }
}
</style>
</head>

<body>

<div class="menu" id="menu">
  <button onclick="toggleMenu()">☰ Menu</button>
  <ul>
      <li onclick="trocarMes('2026-12')">Dezembro 2026</li>
    <li onclick="trocarMes('2026-11')">Novembro 2026</li>
    <li onclick="trocarMes('2026-10')">Outubro 2026</li>
    <li onclick="trocarMes('2026-09')">Setembro 2026</li>
    <li onclick="trocarMes('2026-08')">Agosto 2026</li>
    <li onclick="trocarMes('2026-06')">Junho 2026</li>
    <li onclick="trocarMes('2026-05')">Maio 2026</li>
    <li onclick="trocarMes('2026-04')">Abril 2026</li>
    <li onclick="trocarMes('2026-03')">Março 2026</li>
    <li onclick="trocarMes('2026-02')">Fevereiro 2026</li>
    <li onclick="trocarMes('2026-01')">Janeiro 2026</li>
  </ul>
</div>

<div class="container">
  <h1>Controle de Despesas</h1>
  <h3 id="mesAtual"></h3>

  <input type="text" id="descricao" placeholder="Descrição">
  <input type="number" id="valor" placeholder="Valor">
  <button onclick="adicionar()">Adicionar</button>
  <button class="fechar" onclick="fecharMes()">Fechar mês</button>

  <table>
    <thead>
      <tr>
        <th>Descrição</th>
        <th>Valor</th>
        <th>Ação</th>
      </tr>
    </thead>
    <tbody id="lista"></tbody>
  </table>

  <div class="total" id="total">Total: R$ 0,00</div>
</div>

<script>
let mesAtual = '2026-05';

function toggleMenu(){
  document.getElementById('menu').classList.toggle('closed');
}

function carregarDados(){
  return JSON.parse(localStorage.getItem(mesAtual)) || [];
}

function salvarDados(dados){
  localStorage.setItem(mesAtual, JSON.stringify(dados));
}

function formatar(v){
  return v.toFixed(2).replace('.',',');
}

function render(){
  const lista = document.getElementById('lista');
  lista.innerHTML = '';
  let total=0;

  document.getElementById('mesAtual').innerText = 'Mês atual: ' + mesAtual;

  const despesas = carregarDados();

  despesas.forEach((d,i)=>{
    total+=d.valor;

    lista.innerHTML+=`<tr>
      <td>${d.descricao}</td>
      <td>R$ ${formatar(d.valor)}</td>
      <td><button class="remover-btn" onclick="remover(${i})">Remover</button></td>
    </tr>`;
  });

  document.getElementById('total').innerText=`Total: R$ ${formatar(total)}`;
}

function adicionar(){
  if(localStorage.getItem(mesAtual + '_fechado')){
    alert('Esse mês está fechado!');
    return;
  }

  let despesas = carregarDados();

  const desc=document.getElementById('descricao').value;
  const val=parseFloat(document.getElementById('valor').value);

  if(!desc || isNaN(val)){
    alert('Preencha corretamente');
    return;
  }

  despesas.push({descricao:desc,valor:val});
  salvarDados(despesas);
  render();

  document.getElementById('descricao').value='';
  document.getElementById('valor').value='';
}

function remover(i){
  if(localStorage.getItem(mesAtual + '_fechado')){
    alert('Esse mês está fechado!');
    return;
  }

  let despesas = carregarDados();
  despesas.splice(i,1);
  salvarDados(despesas);
  render();
}

function fecharMes(){
  localStorage.setItem(mesAtual + '_fechado', true);
  alert('Mês fechado!');
}

function trocarMes(mes){
  mesAtual = mes;
  render();
}

render();
</script>

</body>
</html>
