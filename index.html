<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Controle Financeiro</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
body{
  font-family:Arial;
  margin:0;
  background:linear-gradient(135deg,#fff0f5,#fce4ec);
}

/* LOGIN */
.login{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box{
  background:white;
  padding:30px;
  border-radius:15px;
  text-align:center;
}

.login-btn{
  background:linear-gradient(45deg,gold,#d4af37);
  border:none;
  padding:12px;
  border-radius:10px;
}

/* APP */
.app{
  display:none;
  max-width:500px;
  margin:30px auto;
  background:white;
  padding:20px;
  border-radius:15px;
}

/* TOPO */
.topo{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.menu-meses{
  display:flex;
  gap:5px;
  overflow-x:auto;
  margin-top:10px;
}

.menu-meses button{
  padding:6px 10px;
  border:none;
  border-radius:8px;
  background:#eee;
}

.menu-meses .ativo{
  background:gold;
}

/* BOTÕES */
.add{
  background:linear-gradient(45deg,gold,#d4af37);
}

.remover{
  background:#c2185b;
  color:white;
  margin-left:10px;
  padding:4px 8px;
  border:none;
  border-radius:6px;
}

.fechar{
  background:black;
  color:white;
  padding:6px;
  border-radius:6px;
}

input,button{
  width:100%;
  margin-top:10px;
  padding:10px;
  border-radius:10px;
}

.total{
  margin-top:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="login">
  <div class="box">
    <h2>💎 Controle Financeiro</h2>
    <button class="login-btn" onclick="login()">Entrar com Google</button>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">

<div class="topo">
  <h3 id="mesAtual">Janeiro</h3>
  <button class="fechar" onclick="fecharMes()">🔒 Fechar</button>
</div>

<!-- MENU DE MESES -->
<div class="menu-meses" id="menuMeses"></div>

<p id="user"></p>

<input id="desc" placeholder="Descrição">
<input id="val" type="number" placeholder="Valor">

<button class="add" onclick="adicionar()">Adicionar</button>

<ul id="lista"></ul>
<div class="total" id="total"></div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDzPAdEz9KZcosVz76EAjoqLPZ_CLlLDbs",
  authDomain: "controle-de-despesas-d337d.firebaseapp.com",
  projectId: "controle-de-despesas-d337d"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();

let usuario = null;
let mesAtual = "01";
let fechado = false;

const meses = [
"Janeiro","Fevereiro","Março","Abril","Maio","Junho",
"Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"
];

/* LOGIN */
auth.onAuthStateChanged(user=>{
 if(user){
   usuario=user;
   document.getElementById("login").style.display="none";
   document.getElementById("app").style.display="block";
   document.getElementById("user").innerText=user.email;

   criarMenu();
   selecionarMes("01");
 }else{
   login();
 }
});

/* LOGIN */
function login(){
 const provider=new firebase.auth.GoogleAuthProvider();
 auth.signInWithPopup(provider);
}

/* MENU */
function criarMenu(){
 let menu=document.getElementById("menuMeses");
 menu.innerHTML="";

 meses.forEach((nome,i)=>{
   let btn=document.createElement("button");
   let num=(i+1).toString().padStart(2,"0");

   btn.innerText=nome;
   btn.onclick=()=>selecionarMes(num);

   menu.appendChild(btn);
 });
}

/* TROCAR MÊS */
function selecionarMes(num){
 mesAtual=num;

 document.querySelectorAll(".menu-meses button")
 .forEach((b,i)=>{
   b.classList.toggle("ativo", i+1==num);
 });

 document.getElementById("mesAtual").innerText=meses[num-1];

 verificarFechamento();
}

/* VERIFICAR SE FECHADO */
function verificarFechamento(){
 db.collection("meses")
 .doc(usuario.uid+"_"+mesAtual)
 .get()
 .then(doc=>{
   fechado=doc.exists;
   carregar();
 });
}

/* FECHAR MÊS */
function fecharMes(){
 db.collection("meses")
 .doc(usuario.uid+"_"+mesAtual)
 .set({fechado:true});

 fechado=true;
 alert("Mês fechado!");
 carregar();
}

/* CARREGAR */
function carregar(){
 db.collection("despesas")
 .where("user","==",usuario.uid)
 .where("mes","==",mesAtual)
 .get()
 .then(snapshot=>{

   let lista="";
   let total=0;

   snapshot.forEach(doc=>{
     let d=doc.data();
     total+=d.valor;

     lista+=`
     <li>
       ${d.descricao} - R$ ${d.valor}
       ${fechado ? "" : `<button class="remover" onclick="remover('${doc.id}')">Remover</button>`}
     </li>`;
   });

   document.getElementById("lista").innerHTML=lista;
   document.getElementById("total").innerText="Total: R$ "+total.toFixed(2);
 });
}

/* ADICIONAR */
function adicionar(){

 if(fechado) return alert("Mês fechado!");

 let desc=document.getElementById("desc").value;
 let val=parseFloat(document.getElementById("val").value);

 if(!desc||isNaN(val)) return alert("Preencha");

 db.collection("despesas").add({
   descricao:desc,
   valor:val,
   user:usuario.uid,
   mes:mesAtual
 }).then(()=>carregar());
}

/* REMOVER */
function remover(id){
 db.collection("despesas").doc(id).delete()
 .then(()=>carregar());
}
</script>

</body>
</html>
