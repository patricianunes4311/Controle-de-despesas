<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Controle Financeiro</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
body{
  font-family:Arial;
  margin:0;
  background:linear-gradient(135deg,#fff0f5,#fce4ec);
}

/* LOGIN */
.login{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box{
  background:#fff;
  padding:30px;
  border-radius:15px;
  text-align:center;
}

.login-btn{
  background:linear-gradient(45deg,#d4af37,#ffd700);
  border:none;
  padding:12px;
  border-radius:10px;
  width:100%;
}

/* APP */
.app{
  display:none;
  max-width:500px;
  margin:30px auto;
  background:#fff;
  padding:20px;
  border-radius:15px;
}

.topo{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

select{
  padding:8px;
  border-radius:8px;
}

.btn-fechar{
  background:#c2185b;
  color:white;
  border:none;
  padding:8px;
  border-radius:8px;
}

input, button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
}

.add{
  background:linear-gradient(45deg,#d4af37,#ffd700);
}

.remover{
  background:red;
  color:white;
  margin-left:10px;
}

.total{
  margin-top:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="login">
  <div class="box">
    <h2>💎 Controle Financeiro</h2>
    <button class="login-btn" onclick="login()">🔐 Entrar com Google</button>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">

<div class="topo">
  <select id="mes" onchange="trocarMes()">
    <option value="01">Janeiro</option>
    <option value="02">Fevereiro</option>
    <option value="03">Março</option>
    <option value="04">Abril</option>
    <option value="05">Maio</option>
    <option value="06">Junho</option>
    <option value="07">Julho</option>
    <option value="08">Agosto</option>
    <option value="09">Setembro</option>
    <option value="10">Outubro</option>
    <option value="11">Novembro</option>
    <option value="12">Dezembro</option>
  </select>

  <button class="btn-fechar" onclick="fecharMes()">🔒</button>
</div>

<p id="user"></p>

<input id="desc" placeholder="Descrição">
<input id="val" type="number" placeholder="Valor">

<button class="add" onclick="adicionar()">➕ Adicionar</button>

<ul id="lista"></ul>
<div class="total" id="total"></div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDzPAdEz9KZcosVz76EAjoqLPZ_CLlLDbs",
  authDomain: "controle-de-despesas-d337d.firebaseapp.com",
  projectId: "controle-de-despesas-d337d"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();

let usuario = null;
let mesAtual = "01";
let fechado = false;

/* LOGIN */
auth.onAuthStateChanged(user=>{
  if(user){
    usuario=user;
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
    document.getElementById("user").innerText=user.email;

    carregar();
  }else{
    login();
  }
});

function login(){
  const provider=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider);
}

/* TROCAR MÊS */
function trocarMes(){
  mesAtual=document.getElementById("mes").value;
  verificarMes();
}

/* VERIFICAR SE FECHADO */
function verificarMes(){
  db.collection("meses")
  .doc(usuario.uid+"_"+mesAtual)
  .get()
  .then(doc=>{
    fechado=doc.exists;
    carregar();
  });
}

/* FECHAR MÊS */
function fecharMes(){
  db.collection("meses")
  .doc(usuario.uid+"_"+mesAtual)
  .set({fechado:true});

  fechado=true;
  alert("Mês fechado!");
  carregar();
}

/* CARREGAR */
function carregar(){
  db.collection("despesas")
  .where("user","==",usuario.uid)
  .where("mes","==",mesAtual)
  .get()
  .then(snapshot=>{

    let lista="";
    let total=0;

    snapshot.forEach(doc=>{
      let d=doc.data();
      total+=d.valor;

      lista+=`
      <li>
        ${d.descricao} - R$ ${d.valor}
        ${fechado ? "" : `<button class="remover" onclick="remover('${doc.id}')">❌</button>`}
      </li>`;
    });

    document.getElementById("lista").innerHTML=lista;
    document.getElementById("total").innerText="💰 R$ "+total.toFixed(2);
  });
}

/* ADICIONAR */
function adicionar(){

  if(fechado) return alert("Mês fechado!");

  let desc=document.getElementById("desc").value;
  let val=parseFloat(document.getElementById("val").value);

  if(!desc||isNaN(val)) return alert("Preencha");

  db.collection("despesas").add({
    descricao:desc,
    valor:val,
    user:usuario.uid,
    mes:mesAtual
  }).then(()=>carregar());
}

/* REMOVER */
function remover(id){
  if(fechado) return;

  db.collection("despesas").doc(id).delete()
  .then(()=>carregar());
}
</script>

</body>
</html>
