<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Controle de Despesas</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  display:flex;
  background:#fce4ec;
}

/* MENU */
.menu{
  width:220px;
  background:#c2185b;
  color:white;
  padding:20px;
}

.menu h3{
  margin-top:0;
}

.menu button{
  display:block;
  width:100%;
  margin-top:8px;
  padding:8px;
  border:none;
  background:#880e4f;
  color:white;
  cursor:pointer;
  border-radius:5px;
}

.menu button.ativo{
  background:gold;
  color:black;
  font-weight:bold;
}

/* CONTEÚDO */
.main{
  flex:1;
  padding:20px;
}

.box{
  background:white;
  padding:20px;
  border-radius:10px;
}

/* BOTÕES */
.add{
  background:gold;
}

.remover{
  background:red;
  color:white;
  border:none;
  margin-left:10px;
}

.bloqueado{
  background:gray;
  cursor:not-allowed;
}

input,button{
  width:100%;
  margin-top:10px;
  padding:8px;
}

.topo{
  display:flex;
  justify-content:space-between;
}
</style>
</head>

<body>

<div class="menu" id="menu">
  <h3>📅 Meses</h3>
</div>

<div class="main">
<div class="box">

<div class="topo">
  <h2 id="tituloMes">Mês</h2>
  <button onclick="fecharMes()">🔒 Fechar mês</button>
</div>

<p id="user"></p>

<input id="desc" placeholder="Descrição">
<input id="val" type="number" placeholder="Valor">

<button class="add" onclick="adicionar()">➕ Adicionar</button>

<ul id="lista"></ul>
<h3 id="total"></h3>

</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDzPAdEz9KZcosVz76EAjoqLPZ_CLlLDbs",
  authDomain: "controle-de-despesas-d337d.firebaseapp.com",
  projectId: "controle-de-despesas-d337d"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();

let usuario = null;
let mesAtual = "01";
let fechado = false;

const meses = [
  "Janeiro","Fevereiro","Março","Abril","Maio","Junho",
  "Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"
];

/* MENU */
function criarMenu(){
  let menu = document.getElementById("menu");

  meses.forEach((nome,i)=>{
    let btn=document.createElement("button");
    let num=(i+1).toString().padStart(2,"0");

    btn.textContent=nome;
    btn.onclick=()=>trocarMes(num,nome);

    menu.appendChild(btn);
  });
}

/* TROCAR MÊS */
function trocarMes(num,nome){
  mesAtual = num;
  document.getElementById("tituloMes").innerText=nome;

  document.querySelectorAll(".menu button").forEach(b=>b.classList.remove("ativo"));
  event.target.classList.add("ativo");

  verificarMes();
}

/* VERIFICA SE ESTÁ FECHADO */
function verificarMes(){

  db.collection("meses")
  .doc(usuario.uid+"_"+mesAtual)
  .get()
  .then(doc=>{
    fechado = doc.exists;
    carregar();
  });
}

/* FECHAR MÊS */
function fecharMes(){

  db.collection("meses")
  .doc(usuario.uid+"_"+mesAtual)
  .set({fechado:true})
  .then(()=>{
    fechado=true;
    alert("Mês fechado!");
  });
}

/* LOGIN */
auth.onAuthStateChanged(user=>{
  if(user){
    usuario=user;
    document.getElementById("user").innerText=user.email;
    criarMenu();
    trocarMes("01","Janeiro");
  }else{
    login();
  }
});

function login(){
  const provider=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider);
}

/* CARREGAR */
function carregar(){
  db.collection("despesas")
  .where("user","==",usuario.uid)
  .where("mes","==",mesAtual)
  .get()
  .then(snapshot=>{

    let lista=document.getElementById("lista");
    lista.innerHTML="";
    let total=0;

    snapshot.forEach(doc=>{
      let d=doc.data();
      total+=d.valor;

      lista.innerHTML+=`
      <li>
        ${d.descricao} - R$ ${d.valor}
        ${fechado ? "" : `<button class="remover" onclick="remover('${doc.id}')">❌</button>`}
      </li>`;
    });

    document.getElementById("total").innerText="Total: R$ "+total.toFixed(2);
  });
}

/* ADICIONAR */
function adicionar(){

  if(fechado) return alert("Mês fechado!");

  let desc=document.getElementById("desc").value;
  let val=parseFloat(document.getElementById("val").value);

  if(!desc||isNaN(val)) return alert('Preencha');

  db.collection("despesas").add({
    descricao:desc,
    valor:val,
    user:usuario.uid,
    mes:mesAtual
  }).then(()=>carregar());
}

/* REMOVER */
function remover(id){
  if(fechado) return;

  db.collection("despesas").doc(id).delete()
  .then(()=>carregar());
}
</script>

</body>
</html>
